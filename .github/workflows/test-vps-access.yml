name: Test VPS access preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-vps-access-preflight
  cancel-in-progress: true

jobs:
  preflight:
    name: Verify direct SSH access
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Validate required settings
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ -z "$VPS_HOST" || -z "$VPS_USER" || -z "$VPS_SSH_KEY" || -z "$VPS_HOST_FINGERPRINT" ]]; then
            echo "::error::Add VPS_HOST, VPS_USER, VPS_SSH_KEY, and VPS_HOST_FINGERPRINT as repository Actions secrets."
            exit 1
          fi
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::VPS_HOST has an invalid format."; exit 1; }
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*\$?$ ]] || { echo "::error::VPS_USER has an invalid format."; exit 1; }
          [[ "$VPS_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]+=*$ ]] || { echo "::error::VPS_HOST_FINGERPRINT must be an OpenSSH SHA256 fingerprint."; exit 1; }

      - name: Verify host key and SSH without changing the server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/app-cooking-deploy-key"
          known_hosts="$RUNNER_TEMP/app-cooking-known-hosts"
          trap 'rm -f "$key_file" "$known_hosts"' EXIT

          printf '%s\n' "$VPS_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"

          ssh-keyscan -T 15 -t ed25519 "$VPS_HOST" 2>/dev/null > "$known_hosts"
          actual_fingerprints="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)"
          if ! grep -Fxq "$VPS_HOST_FINGERPRINT" <<< "$actual_fingerprints"; then
            echo "::error::The SSH host key fingerprint does not match VPS_HOST_FINGERPRINT."
            exit 1
          fi

          ssh -i "$key_file" -p 22 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            "$VPS_USER@$VPS_HOST" 'test "$(uname -s)" = Linux' >/dev/null
          echo "Direct SSH authentication succeeded. No server files were changed."
