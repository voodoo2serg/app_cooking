name: Android installation smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/install-smoke.yml'

jobs:
  install-and-launch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Install on clean Android 15 and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            APK=app/build/outputs/apk/debug/app-debug.apk
            apksigner verify --verbose --print-certs "$APK"
            aapt dump badging "$APK" | head -n 8
            adb install -r "$APK"
            adb shell am start -W -n ru.vkusdetstva/.MainActivity
            sleep 5
            adb shell pidof ru.vkusdetstva
            if adb logcat -d -v brief | grep -E 'FATAL EXCEPTION|Process: ru.vkusdetstva'; then
              exit 1
            fi
