# Stable signing identity for the app.
# The keystore is committed so that every build (local machine or GitHub Actions CI)
# signs the APK with the SAME key - otherwise Android refuses to update an
# already-installed app over a differently-signed previous version
# (INSTALL_FAILED_UPDATE_INCOMPATIBLE: "приложение не устанавливается").
storeFile=keystore/vkus.jks
storePassword=vkus-detstva-key
keyAlias=vkus
keyPassword=vkus-detstva-key
